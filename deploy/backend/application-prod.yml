# ============================================
# 生产环境配置 - 部署到 Docker 时自动生效
# 此文件会覆盖 JAR 包内的 application.yml 配置
# ============================================

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/law?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${SPRING_DATASOURCE_USERNAME:law_user}
    password: ${SPRING_DATASOURCE_PASSWORD:law_user_2024}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  redis:
    host: redis
    port: 6379
    password: ${SPRING_REDIS_PASSWORD:redis123456}
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

server:
  port: 8080
  servlet:
    context-path: /api/v1

app:
  file:
    upload-path: /app/uploads
    download-url: /api/v1/file/download/
  backup:
    path: /app/backup

logging:
  level:
    root: INFO
    com.lawbackend2.lawbackend2: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /app/logs/application.log